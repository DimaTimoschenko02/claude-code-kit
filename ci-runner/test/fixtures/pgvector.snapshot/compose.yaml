# generated by claude-code-kit ci-runner from runner.json — edit runner.json and re-render
# CI shares a host: bounded memory without swap keeps its OOM inside CI; CPU limits leave room for production.
# Only named volumes: registration, self-updates, tool caches and workspaces survive rebuilds.
# Chromium renderer buffers need shm_size above Docker's 64 MB default.
# A test DB shares loopback with opted-in runners; durability is wasted on disposable test data.
{
  "name": "pgvector-ci",
  "services": {
    "postgres": {
      "image": "ankane/pgvector:v0.5.1",
      "command": [
        "postgres",
        "-p",
        "5436",
        "-c",
        "jit=off",
        "-c",
        "fsync=off",
        "-c",
        "synchronous_commit=off",
        "-c",
        "full_page_writes=off"
      ],
      "environment": {
        "POSTGRES_USER": "myuser",
        "POSTGRES_DB": "pgvector_test",
        "POSTGRES_HOST_AUTH_METHOD": "trust",
        "PGDATA": "/var/lib/postgresql/ci-data"
      },
      "volumes": [
        "pgdata:/var/lib/postgresql"
      ],
      "cpus": 0.5,
      "mem_limit": "384m",
      "memswap_limit": "384m",
      "restart": "unless-stopped",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    },
    "runner": {
      "build": ".",
      "network_mode": "service:postgres",
      "depends_on": [
        "postgres"
      ],
      "environment": {
        "RUNNER_TOKEN": "${RUNNER_TOKEN:-}",
        "RUNNER_REPO_URL": "https://github.com/example-owner/pgvector",
        "RUNNER_NAME": "pgvector-ci",
        "RUNNER_LABELS": "pgvector"
      },
      "volumes": [
        "runner:/home/runner"
      ],
      "cpuset": "2,3",
      "cpu_shares": 256,
      "mem_limit": "1536m",
      "oom_score_adj": 1000,
      "pids_limit": 4096,
      "memswap_limit": "1536m",
      "restart": "unless-stopped",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    }
  },
  "volumes": {
    "pgdata": {},
    "runner": {}
  }
}
